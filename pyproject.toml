[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "model-router"
version = "0.1.0"
description = "An OpenAI-compatible gateway that routes chat completions across providers with policies, circuit breakers, tenancy, budgets and metrics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Daniel Lopez" }]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16",
    "prometheus-client>=0.23",
    "starlette>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "hypothesis>=6.140",
    "respx>=0.22",
    "ruff>=0.14",
    "mypy>=1.18",
    "bandit>=1.8",
    "pip-audit>=2.9",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
model-router = "model_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "ASYNC"]
# N818 would rename NoRouteAvailable and UnknownRoute to *Error; the stdlib does not (StopIteration).
ignore = ["RUF012", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["model_router"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:model_router"]
